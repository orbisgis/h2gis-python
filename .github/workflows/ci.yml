# Tests, packages and publication of h2gis-python.
#
# On every push and pull request: tests on Linux, Windows and macOS, one
# wheel per platform (tested after installation), the source distribution
# and the conda packages (one per platform, for every Python version, tested).
#
# Publication, on a tag v* (it must match __version__ of h2gis/__init__.py),
# or on a manual run (Actions > CI > Run workflow):
# - testpypi: the wheels and the sdist on TestPyPI, to check a release;
# - release: PyPI, the conda channel on anaconda.org (when the secret
#   ANACONDA_API_KEY is set) and a GitHub release with all the packages,
#   tagged v<__version__> on the commit built.
#
# The native libraries come from the release of H2GIS named in
# native/H2GIS_RELEASE (python tools/update_native.py --download).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: none, testpypi, or release (PyPI, conda, GitHub release)"
        type: choice
        options: [none, testpypi, release]
        default: none

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python -c "import re; print(re.search(r'^__version__ = [\"\']([^\"\']+)', open('h2gis/__init__.py').read(), re.M).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "h2gis $version, native libraries of the H2GIS release $(grep -v '^#' native/H2GIS_RELEASE)"
          # A tag must be the version of the package
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag $GITHUB_REF_NAME is not v$version (__version__ of h2gis/__init__.py)"
            exit 1
          fi

  tests:
    name: Tests ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the native library
        run: python tools/update_native.py --download --current-platform
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest test/

  wheels:
    name: Wheel ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tag: manylinux_2_34_x86_64, lib: native/linux-x86_64/h2gis.so }
          - { os: windows-latest, tag: win_amd64, lib: native/windows-x86_64/h2gis.dll }
          - { os: macos-latest, tag: macosx_11_0_arm64, lib: native/macos-arm64/h2gis.dylib }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the native library
        run: python tools/update_native.py --download --current-platform
      - name: Build the wheel
        run: |
          python -m pip install build wheel
          python tools/build_wheel.py ${{ matrix.lib }} ${{ matrix.tag }}
          ls -l dist
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          wheel=$(ls dist/*.whl)
          "$bin/python" -m pip install "$wheel[test]"
          # Run from outside the checkout: the tests use the installed package
          # and its own native library (h2gis/lib/)
          cd "$RUNNER_TEMP"
          "$bin/python" -c "import h2gis._native as n; print(n.default_library_path())"
          "$bin/python" -m pytest "$GITHUB_WORKSPACE/test"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  conda:
    name: Conda ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the native library
        run: python tools/update_native.py --download --current-platform
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          init-shell: bash
          create-args: rattler-build
      - name: Build and test the package (noarch python, for this system)
        env:
          H2GIS_VERSION: ${{ needs.version.outputs.version }}
        run: rattler-build build --recipe recipe/ --output-dir conda-out -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: conda-out/*/*.conda

  publish-testpypi:
    name: Publish on TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: [tests, wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, tests, wheels, sdist, conda]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A publication run again: the files already on PyPI are skipped
          skip-existing: true

  publish-conda:
    name: Publish on anaconda.org
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, tests, conda]
    runs-on: ubuntu-latest
    environment: anaconda
    env:
      ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
      ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'orbisgis' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: conda
          merge-multiple: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: upload
          init-shell: bash
          create-args: rattler-build
      - name: Upload
        run: |
          if [ -z "$ANACONDA_API_KEY" ]; then
            echo "::notice::No ANACONDA_API_KEY secret: the conda packages are only attached to the GitHub release"
            exit 0
          fi
          # The artifacts keep the folder of the packages (noarch/)
          mapfile -t packages < <(find conda -name '*.conda' | sort)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No conda package in the artifacts"; exit 1
          fi
          printf '%s\n' "${packages[@]}"
          # A package already on anaconda.org is refused: change __version__
          # (or the build number of the recipe) to publish again
          rattler-build upload anaconda --owner "$ANACONDA_OWNER" "${packages[@]}"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        run: |
          # The conda packages come in a folder (noarch/): all files flat
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist
          cd dist
          sha256sum * > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A publication run again: the files of the release are replaced
            gh release upload "$TAG" * --clobber
          else
            # --target: on a manual run, the tag is created on the commit built
            gh release create "$TAG" * --target "$GITHUB_SHA" --title "h2gis $TAG" --generate-notes
          fi