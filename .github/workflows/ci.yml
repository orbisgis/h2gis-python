# Tests, packages and publication of h2gis-python.
#
# On every push and pull request: tests on Linux, Windows and macOS, one
# wheel per platform (tested after installation), the source distribution
# and the conda packages (one per platform, for every Python version, tested).
#
# Publication, on a tag v* (it must match __version__ of h2gis/__init__.py),
# or on a manual run (Actions > CI > Run workflow):
# - testpypi: the wheels and the sdist on TestPyPI, to check a release;
# - release: PyPI, the conda channel on anaconda.org (when the secret
#   ANACONDA_API_KEY is set) and a GitHub release with all the packages,
#   tagged v<__version__> on the commit built.
#
# The native libraries come from a GitHub release of H2GIS (python
# tools/update_native.py --download <release>), chosen by the version job:
# - manual run: the H2GIS version chosen in the form (by default the one of
#   native/H2GIS_RELEASE);
# - push, pull request, tag v*: the release named in native/H2GIS_RELEASE.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: none, testpypi, or release (PyPI, conda, GitHub release)"
        type: choice
        options: [none, testpypi, release]
        default: none
      h2gis:
        description: "H2GIS native libraries: native/H2GIS_RELEASE (committed), latest = the last release of H2GIS, graalvm-snapshot = the build of master"
        type: choice
        # GitHub cannot fill this list from the releases of H2GIS: add the
        # new versions here, or give one in the field below.
        options:
          - native/H2GIS_RELEASE
          - latest
          - graalvm-snapshot
          - v2.2.6
        default: native/H2GIS_RELEASE
      h2gis_other:
        description: "Another H2GIS version (e.g. v2.2.7), used instead of the list above if given"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      h2gis: ${{ steps.h2gis.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: h2gis
        name: H2GIS native libraries
        env:
          GH_TOKEN: ${{ github.token }}
          H2GIS_REPO: orbisgis/h2gis
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && (inputs.h2gis_other || inputs.h2gis) || 'native/H2GIS_RELEASE' }}
        run: |
          release="$(echo "$CHOSEN" | tr -d '[:space:]')"
          if [ "$release" = "native/H2GIS_RELEASE" ]; then
            release=$(grep -v '^#' native/H2GIS_RELEASE | tr -d '[:space:]')
          fi
          if [ "$release" = "latest" ]; then
            # The last release of H2GIS (graalvm-snapshot is a pre-release: excluded)
            release=$(gh release view -R "$H2GIS_REPO" --json tagName -q .tagName)
          elif [[ "$release" =~ ^[0-9] ]]; then
            release="v$release"
          fi
          if ! gh release view "$release" -R "$H2GIS_REPO" --json assets -q '.assets[].name' \
              | grep -x 'h2gis-linux-x86_64.so' > /dev/null; then
            echo "::error::The H2GIS release $release has no native libraries: run the workflow \"CI GraalVM\" of H2GIS on the tag $release (Actions > CI GraalVM > Run workflow, Use workflow from: $release), or choose another version."
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "::notice::H2GIS native libraries: $release"
          echo "H2GIS native libraries: **$release**" >> "$GITHUB_STEP_SUMMARY"
      - id: version
        run: |
          version=$(python -c "import re; print(re.search(r'^__version__ = [\"\']([^\"\']+)', open('h2gis/__init__.py').read(), re.M).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "h2gis $version, native libraries of the H2GIS release ${{ steps.h2gis.outputs.release }}"
          # A tag must be the version of the package
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag $GITHUB_REF_NAME is not v$version (__version__ of h2gis/__init__.py)"
            exit 1
          fi

  tests:
    name: Tests ${{ matrix.os }} Python ${{ matrix.python }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the native library
        run: python tools/update_native.py --download "${{ needs.version.outputs.h2gis }}" --current-platform
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest test/

  wheels:
    name: Wheel ${{ matrix.tag }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tag: manylinux_2_34_x86_64, lib: native/linux-x86_64/h2gis.so }
          - { os: windows-latest, tag: win_amd64, lib: native/windows-x86_64/h2gis.dll }
          - { os: macos-latest, tag: macosx_11_0_arm64, lib: native/macos-arm64/h2gis.dylib }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the native library
        run: python tools/update_native.py --download "${{ needs.version.outputs.h2gis }}" --current-platform
      - name: Build the wheel
        run: |
          python -m pip install build wheel
          python tools/build_wheel.py ${{ matrix.lib }} ${{ matrix.tag }}
          ls -l dist
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          wheel=$(ls dist/*.whl)
          "$bin/python" -m pip install "$wheel[test]"
          # Run from outside the checkout: the tests use the installed package
          # and its own native library (h2gis/lib/)
          cd "$RUNNER_TEMP"
          "$bin/python" -c "import h2gis._native as n; print(n.default_library_path())"
          "$bin/python" -m pytest "$GITHUB_WORKSPACE/test"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  conda:
    name: Conda ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the native library
        run: python tools/update_native.py --download "${{ needs.version.outputs.h2gis }}" --current-platform
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          init-shell: bash
          create-args: rattler-build
      - name: Build and test the package (noarch python, for this system)
        env:
          H2GIS_VERSION: ${{ needs.version.outputs.version }}
        run: rattler-build build --recipe recipe/ --output-dir conda-out -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: conda-out/*/*.conda

  publish-testpypi:
    name: Publish on TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: [tests, wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, tests, wheels, sdist, conda]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A publication run again: the files already on PyPI are skipped
          skip-existing: true

  publish-conda:
    name: Publish on anaconda.org
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, tests, conda]
    runs-on: ubuntu-latest
    environment: anaconda
    env:
      ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
      ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'orbisgis' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: conda
          merge-multiple: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: upload
          init-shell: bash
          create-args: rattler-build
      - name: Upload
        run: |
          if [ -z "$ANACONDA_API_KEY" ]; then
            echo "::notice::No ANACONDA_API_KEY secret: the conda packages are only attached to the GitHub release"
            exit 0
          fi
          # The artifacts keep the folder of the packages (noarch/)
          mapfile -t packages < <(find conda -name '*.conda' | sort)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No conda package in the artifacts"; exit 1
          fi
          printf '%s\n' "${packages[@]}"
          # A package already on anaconda.org is refused: change __version__
          # (or the build number of the recipe) to publish again
          rattler-build upload anaconda --owner "$ANACONDA_OWNER" "${packages[@]}"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'release')
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      H2GIS_RELEASE: ${{ needs.version.outputs.h2gis }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        run: |
          # The conda packages come in a folder (noarch/): all files flat
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist
          cd dist
          sha256sum * > SHA256SUMS
          h2gis_line="H2GIS native libraries: [$H2GIS_RELEASE](https://github.com/orbisgis/h2gis/releases/tag/$H2GIS_RELEASE)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A publication run again: the files of the release are replaced
            gh release upload "$TAG" * --clobber
            # Update the H2GIS line of the notes (or add it)
            notes=$(gh release view "$TAG" --json body -q .body | grep -v '^H2GIS native libraries: ' || true)
            gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$h2gis_line" "$notes")"
          else
            # --target: on a manual run, the tag is created on the commit built
            # --notes is put before the generated notes
            gh release create "$TAG" * --target "$GITHUB_SHA" --title "h2gis $TAG" \
              --notes "$h2gis_line" --generate-notes
          fi
